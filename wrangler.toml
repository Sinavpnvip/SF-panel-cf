name = "sf-panel-cf"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sf-panel-db"
database_id = "69f9a415-cbde-4a42-90d5-a28a30b62fd8"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "acff03347952410b96447e8c9bc11677"

[vars]
APP_NAME = "SF-Panel"
APP_VERSION = "2.0.0"
PUBLIC_DOMAIN = ""
SUB_TITLE = "SF VPN"
REF_PERCENT = "20"
TRIAL_GB = "1"
TRIAL_DAYS = "1"
TRIAL_COOLDOWN_DAYS = "7"
MIN_DEPOSIT = "10000"
RATE_LIMIT_PER_MIN = "60"
SESSION_DAYS = "7"
